<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renomear PDF por Rastreamento</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Add JSZip for client-side zipping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Renomeador de PDF (Cliente-Side)</h1>
            <p>Processamento em lote inteligente. Sem limite de arquivos. O servidor apenas lê, seu navegador constrói o
                ZIP.</p>
        </header>

        <form id="uploadForm">
            <div class="drop-zone" id="dropZone">
                <span class="drop-zone__prompt">Arraste seus PDFs aqui ou clique p/ upload</span>
                <input type="file" name="pdfs" class="drop-zone__input" id="fileInput" multiple accept=".pdf">
            </div>

            <div id="progressContainer" style="display:none; margin-top: 20px;">
                <div style="background: #e9ecef; border-radius: 5px; height: 20px; width: 100%; overflow: hidden;">
                    <div id="progressBar" style="width: 0%; height: 100%; background: #007bff; transition: width 0.3s;">
                    </div>
                </div>
                <p id="progressText" style="margin-top: 5px; font-size: 0.9em; text-align: center;">Aguardando...</p>
            </div>

            <div id="fileList" class="file-list"></div>
            <button type="submit" class="btn" id="submitBtn" disabled>Processar e Baixar ZIP</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const input = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('uploadForm');
        const status = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        dropZone.addEventListener('click', () => input.click());

        input.addEventListener('change', updateFileList);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, () => {
                dropZone.classList.remove('drop-zone--over');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) {
                input.files = e.dataTransfer.files;
                updateFileList();
            }
        });

        function updateFileList() {
            fileList.innerHTML = '';
            status.innerHTML = ''; // Clear status
            progressContainer.style.display = 'none';

            if (input.files.length > 0) {
                submitBtn.disabled = false;
                const count = input.files.length;
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.textAlign = 'center';
                div.innerHTML = `<strong>${count}</strong> arquivo${count > 1 ? 's' : ''} selecionado${count > 1 ? 's' : ''}.`;
                fileList.appendChild(div);
            } else {
                submitBtn.disabled = true;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (input.files.length === 0) return;

            submitBtn.disabled = true;
            progressContainer.style.display = 'block';
            status.innerHTML = '';

            const zip = new JSZip();
            const failures = [];
            const files = Array.from(input.files);
            const total = files.length;
            let processed = 0;

            const batchId = Date.now();
            console.log(`[BATCH] Iniciando processamento de ${total} arquivos.`);

            for (let i = 0; i < total; i++) {
                const file = files[i];
                const currentNum = i + 1;

                // Update UI
                const percent = Math.round((processed / total) * 100);
                progressBar.style.width = `${percent}%`;
                progressText.textContent = `Processando ${currentNum}/${total}: ${file.name}...`;

                try {
                    const formData = new FormData();
                    formData.append('pdf', file);

                    // Send to server for identification only
                    const response = await fetch('/process-single', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success && data.newName) {
                        // Success! Add *original* file content to zip with *new* name
                        zip.file(data.newName, file);
                        console.log(`[OK] ${file.name} -> ${data.newName}`);
                    } else {
                        // Logic failure (no code found)
                        console.warn(`[FAIL] ${file.name}: ${data.error}`);
                        failures.push({ name: file.name, reason: data.error || 'Não identificado' });
                    }

                } catch (err) {
                    console.error(`[ERROR] ${file.name}:`, err);
                    failures.push({ name: file.name, reason: 'Erro de rede ou servidor' });
                }

                processed++;
                progressBar.style.width = `${Math.round((processed / total) * 100)}%`;
            }

            // Finalizing
            progressText.textContent = 'Gerando arquivo ZIP...';

            try {
                // Generate ZIP if we have files
                const content = await zip.generateAsync({ type: "blob" });

                // Trigger Download
                if (Object.keys(zip.files).length > 0) {
                    saveAs(content, `renomeados_${Date.now()}.zip`);

                    let msg = `<div style="color: #28a745; margin-bottom: 10px; font-weight: bold;">✅ Processamento concluído! Download iniciado.</div>`;
                    if (failures.length > 0) {
                        msg += `<div style="background: #fff3f3; border: 1px solid #ffc9c9; padding: 10px; border-radius: 5px; font-size: 0.9em; color: #d32f2f;">`;
                        msg += `<strong>⚠️ ${failures.length} arquivo(s) não puderam ser renomeados:</strong><ul style="margin: 5px 0 0 20px;">`;
                        failures.forEach(f => {
                            msg += `<li>${f.name} (${f.reason})</li>`;
                        });
                        msg += `</ul></div>`;
                    }
                    status.innerHTML = msg;
                } else {
                    status.innerHTML = `<div style="color: #d32f2f; font-weight: bold;">❌ Nenhum arquivo pôde ser identificado.</div>`;
                    if (failures.length > 0) {
                        let msg = `<div style="margin-top:10px; font-size: 0.9em; text-align: left;">`;
                        failures.forEach(f => {
                            msg += `<div>- ${f.name}: ${f.reason}</div>`;
                        });
                        msg += `</div>`;
                        status.innerHTML += msg;
                    }
                }

            } catch (zipErr) {
                console.error("ZIP Error:", zipErr);
                status.innerHTML = '<span style="color: red;">Erro ao gerar o arquivo ZIP.</span>';
            }

            submitBtn.disabled = false;
            progressText.textContent = 'Concluído.';
        });
    </script>
</body>

</html>
